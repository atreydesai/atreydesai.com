experience:
  - organization: University of Maryland, College Park
    dates: May 2024 – present
    role: Undergrad Researcher, CLIP Lab
    advisors: 'Advisors: Prof. Rachel Rudinger & Prof. Jordan Boyd-Graber'
    bullets:
      - >-
        Quantified differential LLM susceptibility to human-written vs.
        LLM-generated MCQs to assess if questions contain unintended artifacts
        and are solvable without full context; created tools to isolate
        distractor-choice provenance effects and improve the reliability of
        human synthetic data for model evaluation and distillation.
      - >-
        Constructed an adversarial benchmark to test VLM capabilities in
        detecting out-of-context (OOC) video-based misinformation on social
        media based on multimodal clues and user interactions to probe
        reasoning under deceptive framing.
      - >-
        Applied causal interpretability techniques to demonstrate that LMs
        require significantly more data than humans to acquire general
        syntactic representations, revealing heightened sensitivity to
        item-level and construction-level variation.
      - >-
        Developed an oracle-free framework for estimating process reward
        annotation quality without ground truth using behavioral signals,
        inducing better step-by-step reasoning in Process Reward Models (PRMs)
        for RL in non-verifiable tasks.

  - organization: The University of Texas at Arlington
    dates: Feb 2024 – present
    role: Visiting Researcher, ACL2 Lab & NSF
    advisors: 'Advisor: Prof. Kenny Zhu'
    bullets:
      - >-
        Designed AniVoice-cat, a dataset of 26,000+ annotated cat vocalizations
        from 250+ hours of video and identified 57 unique cat phones,
        establishing a foundational resource for computational research in
        non-human communication.
      - >-
        Improved transcription pipeline using PANNs and HuBERT models to 96%
        accuracy with 93% top-5 accuracy in action recognition, setting a new
        state-of-the-art for automated animal vocalization analysis.

  - organization: Learn Prompting
    dates: May 2025 – Jan 2026
    role: Member of Technical Staff (San Francisco, CA)
    bullets:
      - >-
        Ran Hackaprompt, the world's largest red-teaming hackathon, overseeing
        user engagement and technical challenges.
      - >-
        Researched the robustness of AI safety judges against CBRNE-related
        adversarial content.

  - organization: University of Maryland, College Park
    dates: Dec 2023 – Aug 2024
    role: Researcher, FIRE Sustainability Analytics Lab
    advisors: 'Advisor: Prof. Thanicha Ruangmas'
    bullets:
      - >-
        Developed Python pipeline for environmental impact assessments of U.S.
        emissions, enabling more efficient policy.
      - >-
        Drafted a framework to guide evidence-based policymaking on climate
        restoration strategies.

  - organization: Brown University
    dates: Dec 2020 – June 2023
    role: Researcher, Reinforcement Learning at Brown Group
    advisors: 'Advisor: Prof. Michael Littman'
    bullets:
      - >-
        Developed a custom RL environment that empowered non-technical users to
        programmatically solve complex tasks by defining reward functions and
        specifying agent behavior, reducing task setup time.
      - >-
        Published and presented research at two top-tier workshops (AAAI,
        RLDM), demonstrating how human-readable interfaces enable fine-grained
        control during inference and improve AI-human interaction in robotics.

