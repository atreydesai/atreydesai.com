banner:
  lead: "I am **applying to Ph.D. programs this fall (2026-27 cycle)**. I'm happy [to talk]() and open to collaborations & invited talks! I also be attending ACL and ICML. See you in San Diego and Seoul!"
  body: "This summer, I will be **(1)** organizing [QUANTA](https://qanta-org.github.io/) and the [EMM-QA ICML workshop](https://qanta-org.github.io/competition/2026/icml/), and **(2)** working with Professor [Mohit Iyyer](https://www.cs.umd.edu/~miyyer/) on AI agents for long-form text generation [(autofiction.ai)](https://autofiction.ai/)."

