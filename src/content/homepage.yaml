researchInterests:
  intro: "Language models are increasingly deployed as agents in open-ended, real-world environments; however, our ability to know when to trust these systems has not kept pace. I study how to make AI systems trustworthy, robust, and useful in practice, namely:"
  items:
    - title: "Calibrate"
      summary: "Calibrate model confidence under incomplete, uncertain, and excessive information."
      question: "How do we improve the confidence calibration of models reasoning under uncertainty (insufficient information, excessive information, and long-tail settings) and updating on new information?"
      citations:
        - label: "ttr"
          url: "/research/#test-time-reasoners"
        - label: "IP1"
          url: null
        - label: "IP2"
          url: null
    - title: "Act"
      summary: "Build systems for open-ended work without clear ground truth."
      question: "How can we build better harnesses and systems to act on calibrated trust in live and open-ended environments (forecasting, long-form text generation, AI for science) where there is no ground truth?"
      citations:
        - label: "benchmarker"
          url: "/research/#benchmarker"
        - label: "quick"
          url: "/research/#llm-distractors"
        - label: "artifacts"
          url: "/research/#mcq-artifacts"
        - label: "IP2"
          url: null
        - label: "IP3"
          url: null
    - title: "Coordinate"
      summary: "Study how people rely on and adopt agents in open-ended settings."
      question: "How do agents interact with humans and other agents in these environments (collaborative writing, intelligence analysis)?"
      citations:
        - label: "quick"
          url: "/research/#llm-distractors"
        - label: "IP2"
          url: null
        - label: "IP3"
          url: null

