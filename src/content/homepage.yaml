researchInterests:
  # Each item's `quadrant` draws a 2×2 glyph beside its title, filling the
  # listed cells (see QuadrantCell in src/lib/content.ts); it and
  # `quadrantLabel` appear only when details are expanded.
  # IP labels follow the banner's project order: IP1 AutoFiction, IP2 QANTA,
  # IP3 out-of-context video.
  intro: "When an agent writes a novel or grades an essay, there is no answer key, and what counts as good work keeps shifting as people adapt to it. So how do we know when to trust it? I study how humans and models build calibrated trust in open-ended work:"
  items:
    - title: "Calibrate"
      quadrant: ["se", "ce"]
      quadrantLabel: "uncertain"
      summary: "Calibrate models’ confidence when information is missing, long-tail, or self-generated."
      question: "How do agents form and update calibrated beliefs about the world, their partners, and their own work under uncertainty (insufficient information, long-tail settings, self-graded writing)?"
      citations:
        - label: "ttr"
          url: "/research/#test-time-reasoners"
        - label: "IP3"
          url: null
        - label: "IP1"
          url: null
    - title: "Coordinate"
      quadrant: ["cc", "ce"]
      quadrantLabel: "adapting"
      summary: "Study when people trust, delegate to, or override agents."
      question: "How do humans and agents form accurate expectations of one another and adapt over repeated interaction (human-AI quizbowl, collaborative writing)?"
      citations:
        - label: "authoring"
          url: "/research/#adversarial-multimodal-questions"
        - label: "IP2"
          url: null
    - title: "Verify"
      quadrant: ["ce"]
      quadrantLabel: "both"
      summary: "Build judges that stay calibrated to people as standards shift."
      question: "How should LLM judges evaluate open-ended work, and decide which synthetic data is worth training on, so that the models trained on their own choices stay aligned with human intent (benchmarks, long-form writing, forecasting)?"
      citations:
        - label: "benchmarker"
          url: "/research/#benchmarker"
        - label: "artifacts"
          url: "/research/#mcq-artifacts"
        - label: "distractors"
          url: "/research/#llm-distractors"
        - label: "authoring"
          url: "/research/#adversarial-multimodal-questions"
        - label: "IP1"
          url: null

