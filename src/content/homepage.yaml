researchInterests:
  intro: "Language models are becoming agents that act in open-ended, real-world environments, but our ability to know when to trust them for practical tasks lags behind. I want to make AI systems trustworthy, robust, and genuinely useful as they take on that role, namely:"
  items:
    - text: "**1. Knowing when to trust a model:** how do we improve the confidence calibration of models reasoning under uncertainty (insufficient information, excessive information, and long-tail settings) and updating on new information?"
      citations:
        - label: "ttr"
          url: "/research/#test-time-reasoners"
        - label: "IP1"
          url: null
        - label: "IP2"
          url: null
    - text: "**2. Acting on that trust:** how can we build better harnesses and systems to act on calibrated trust in live and open-ended environments (forecasting, long-form text generation, AI for science) where there is no ground truth?"
      citations:
        - label: "benchmarker"
          url: "/research/#benchmarker"
