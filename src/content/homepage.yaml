intro:
  - "I am a senior (fourth-year) undergraduate student studying computer science and linguistics with a minor in korean studies at the [University of Maryland](https://umd.edu)."
  - "I am fortunate to be advised by Professors [Rachel Rudinger](https://rudinger.github.io/) and [Jordan Boyd-Graber](http://www.umiacs.umd.edu/~jbg)."

banner:
  lead: "I am **applying to Ph.D. programs this fall (2026-27 cycle)**. I'm happy [to talk]() virtually and I will also be attending ACL and ICML. See you in San Diego and Seoul!"
  body: "This summer, I will be **(1)** organizing [QANTA](https://qanta-org.github.io/) and the [EMM-QA ICML workshop](https://qanta-org.github.io/competition/2026/icml/), and **(2)** working with Professor [Mohit Iyyer](https://www.cs.umd.edu/~miyyer/) on AI agents for long-form text generation [(autofiction.ai)](https://autofiction.ai/)."

researchInterests:
  intro: "Language models are increasingly capable, but our methods to understand and practically use those capabilities lag behind. I work on the data, evaluation, and calibration that make AI systems reliably useful to people, namely:"
  items:
    - text: "1. Human-AI collaboration: how can humans and AI work together to better generate and refine data in close-ended (MCQA) and open-ended formats (long-form text)."
      citations:
        - label: "benchmarker"
