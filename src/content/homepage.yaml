researchInterests:
  intro: "Language models are increasingly capable, but our methods for measuring and building that capability lag behind. I work on evaluation and data pipelines for reliable NLP, namely:"
  items:
    - "1. Benchmark validity and the limits of what our evaluations actually measure"
    - "2. Human-AI collaboration in data annotation and curation"
    - "3. Evaluation for systems that reason, perceive, and act in the world"

