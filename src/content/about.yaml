# Professional section - your academic/research bio
professional:
  intro: "I'm **Atrey Desai**, a senior (fourth-year) undergraduate student studying [computer science](https://www.cs.umd.edu/) and [linguistics](https://linguistics.umd.edu/) at the [University of Maryland](https://umd.edu). I am fortunate to be advised by Professors [Rachel Rudinger](https://rudinger.github.io/), [Jordan Boyd-Graber](http://www.umiacs.umd.edu/~jbg), and [Mohit Iyyer](https://www.cs.umd.edu/~miyyer/)."

  paragraphs:
    - text: "I am also thankful to [Nishant Balepur](https://nbalepur.github.io/), [Yoo Yeon Sung](https://yysung.github.io/), and [Sathvik Nair](https://sathvikn.github.io/) for their mentoring."

    - text: "I am a member of the UMD [CLIP](https://clip.umd.edu/) lab. I was also a visiting researcher under Professor [Kenny Zhu](https://kenzhu2000.github.io/) at the [ACL2](https://uta-acl2.github.io/) Lab, where I studied the structure and meaning of animal vocalizations.[^1] I was previously a member of the technical staff of [Learn Prompting](https://learnprompting.org), where I worked on HackAPrompt and research on creating trustworthy and robust AI safety judges.[^2] Before college, I worked with Professor [Michael Littman](https://littmania.com/) at the [RLAB](http://irl.cs.brown.edu/) group at Brown University on applications of reinforcement learning to 2D non-sequential tasks.[^3]"

    - text: "My Erdős number is 3: me → Jordan Boyd-Graber → Maria Klawe → Paul Erdős."

# Personal section
personal:
  descriptions:
    - "I would describe myself as curious, bubbly, and passionate. I love exploring new ideas and enjoy working at the boundary between disciplines, especially when they reveal unexpected connections. Naturally, this led me to NLP, where I found computer science meets reading and journalism."
    - "On the day to day, you'll probably find me at the lab, or at the gym, or at [a boba shop](https://share.google/uG66fHdt79TEs0HtE), or wandering about aimlessly looking through my camera viewfinder!"
  interests: "forecasting (on [manifold](https://manifold.markets) and [LEAP](https://leap.forecastingresearch.org))[^5][^6], photography, reading[^7], graphic design[^8], learning languages, punching the air, music (esp. indie pop, edm, and baroque), and cultures of the world"
  blogs: []

# Location section
location:
  text: "I was born and grew up in Saratoga, California, attending the lovely [Saratoga High School](https://www.saratogahigh.org/). I currently live in the Washington, DC area. I frequent New York City and Boston for work and visiting friends. If you are ever around and want to talk, feel free to reach out!"

