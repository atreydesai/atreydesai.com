# Professional section - your academic/research bio
professional:
  intro: "I'm **Atrey Desai**, a third-year undergraduate student studying [computer science](https://www.cs.umd.edu/) and [linguistics](https://linguistics.umd.edu/) with a minor in [korean studies](https://sllc.umd.edu/fields/korean) at the [University of Maryland](https://umd.edu). I am fortunate to be advised by [Professor Rachel Rudinger](https://rudinger.github.io/) and [Professor Jordan Boyd-Graber](http://www.umiacs.umd.edu/~jbg)."
  
  paragraphs:
    - text: "I am also eternally thankful for [Nishant Balepur](https://nbalepur.github.io/), [Yoo Yeon Sung](https://yysung.github.io/), and [Sathvik Nair](https://sathvikn.github.io/) for taking a curious undergraduate under their wing."

    - text: "I am a member of the [Computational Linguistics and Information Processing (CLIP) lab](https://clip.umd.edu/) in UMIACS. Currently, I'm also a visiting researcher under [Professor Kenny Zhu](https://kenzhu2000.github.io/) at the [Arlington Computational Linguistics Lab (ACL2)](https://uta-acl2.github.io/) at the University of Texas at Arlington. Our work focuses on identifying structural similarities to human language and contextual semantics within animal vocalizations to gain insights about the language of animal species."
      footnote: 1
      
    - text: "I was previously a member of the technical staff of [Learn Prompting](https://learnprompting.org), where I worked on HackAPrompt and research on creating trustworthy and robust AI safety judges."
      footnote: 2
      
    - text: "Previously, I worked under [Professor Michael Littman](https://littmania.com/) at the [Reinforcement Learning & Adaptive Behavior (RLAB)](http://irl.cs.brown.edu/) group at Brown University on applications of reinforcement learning to 2D non-sequential tasks."
      footnote: 3

# Personal section
personal:
  descriptions:
    - "I would describe myself as **curious** and **bubbly**. I love exploring new ideas and live at the boundary between disciplines, especially when they reveal unexpected structure. Naturally, this impulse led me to NLP, a field where computer science meets reading and journalism, my favorite pastimes growing up."
    - "On the day to day, you'll probably find me at the lab, or at the gym, or at [Moge Tea](https://share.google/uG66fHdt79TEs0HtE), or wandering about aimlessly looking through my camera viewfinder!"
  interests: "photography, reading[^4], graphic design[^5], learning languages, punching the air, music (especially edm and indie pop), [manifold](https://manifold.markets)[^6], and cultures of the world"
  blogs: []

# Location section  
location:
  text: "I was born and grew up in **Saratoga, California**, attending the lovely [Saratoga High School](https://www.saratogahigh.org/). I currently live in the Washington, DC area, specifically in College Park, MD. I also tend to frequent the New York City and Boston areas for work and visiting friends. If you are ever around and want to talk, feel free to reach out!"

