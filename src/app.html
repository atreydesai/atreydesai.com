<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Preconnects for font origins (kept <= 4) -->
  <link rel="preconnect" href="https://use.typekit.net" />
  <link rel="preconnect" href="https://p.typekit.net" crossorigin />
  <!-- Preload hero image for LCP -->
  <link rel="preload" as="image" href="/images/profile.webp" fetchpriority="high" />
  <!-- Adobe Typekit - Neue Haas Grotesk (async, non-blocking) -->
  <link rel="preload" as="style" href="https://use.typekit.net/nsg3mxc.css?display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://use.typekit.net/nsg3mxc.css?display=swap" /></noscript>
  <!-- Source Serif 4 — self-hosted variable font (full OpenType features,
       Google Fonts strips onum). @font-face lives in app.css. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/SourceSerif4Variable-Roman.latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/SourceSerif4Variable-Italic.latin.woff2" crossorigin />
  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="Atrey Desai - Blog" href="/rss.xml" />
  <!-- Favicons -->
  <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="language" content="en" />
  <meta name="format-detection" content="telephone=no" />
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#FDF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
